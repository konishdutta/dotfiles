# tmux 3.8 configuration for WSL2 + Windows Terminal.
# The XDG config is canonical; ~/.tmux.conf is a compatibility symlink.

# Ergonomic prefix. Ctrl+A twice passes Ctrl+A to the foreground program.
unbind C-b
set -g prefix C-a
bind-key C-a send-prefix

# Reliable shell and Neovim behavior in Windows Terminal.
set -g default-terminal 'tmux-256color'
set -as terminal-features ',xterm-256color:RGB:sync'
set -as terminal-features ',tmux-256color:RGB'
# Windows Terminal may split escape sequences across reads; 50 ms also avoids
# fast Esc+j being interpreted as Alt+j in Neovim.
set -g escape-time 50
set -g focus-events on
set -g assume-paste-time 1
set -g set-clipboard on

# Window/pane ergonomics.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g mouse on
setw -g mode-keys vi
set -g status-keys vi
set -g repeat-time 600
set -g status on
set -g status-interval 5
set -g focus-events on

# New windows and splits start in the current pane's working directory.
bind-key c new-window -c '#{pane_current_path}'
bind-key '|' split-window -h -c '#{pane_current_path}'
bind-key - split-window -v -c '#{pane_current_path}'

# Pane navigation is shared with Neovim by Smart Splits; uppercase keys resize.
bind-key -r H resize-pane -L 5
bind-key -r J resize-pane -D 5
bind-key -r K resize-pane -U 5
bind-key -r L resize-pane -R 5
bind-key -r '<' swap-window -d -t -1
bind-key -r '>' swap-window -d -t +1
bind-key Tab last-window
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Prefix+F opens fzf in a temporary popup; no project window/template is made.
bind-key f display-popup -E -w 85% -h 75% "$HOME/.local/bin/tmux-sessionizer"

# Reload and explicit workspace save/restore.
bind-key r source-file ~/.tmux.conf \; display-message 'tmux config reloaded'
bind-key C-s run-shell -b '~/.tmux/plugins/tmux-resurrect/scripts/save.sh'
bind-key C-r run-shell -b '~/.tmux/plugins/tmux-resurrect/scripts/restore.sh'

# Tokyo Night Moon: keep the status concise and useful.
set -g @tokyo-night-tmux_theme 'moon'
set -g @tokyo-night-tmux_transparent 0
set -g @tokyo-night-tmux_show_path 1
set -g @tokyo-night-tmux_show_git 1
set -g @tokyo-night-tmux_show_datetime 1
set -g @tokyo-night-tmux_show_right_widgets 'path, git, datetime'

# WSL clipboard through the installed Windows Neovim win32yank bridge.
set -g @yank_selection 'clipboard'
set -g @yank_selection_mouse 'clipboard'
set -g @override_copy_command "win32yank.exe -i --crlf"

# smart-splits v3 tmux backend settings; these must match Neovim's config.
set -g @smart-splits_at_edge 'wrap'
set -g @smart-splits_move_left_key 'C-h'
set -g @smart-splits_move_down_key 'C-j'
set -g @smart-splits_move_up_key 'C-k'
set -g @smart-splits_move_right_key 'C-l'
set -g @smart-splits_resize_left_key 'M-h'
set -g @smart-splits_resize_down_key 'M-j'
set -g @smart-splits_resize_up_key 'M-k'
set -g @smart-splits_resize_right_key 'M-l'
set -g @smart-splits_resize_step_size '3'

# Resurrect stores pane geometry/cwd and only its safe default process list.
# Python jobs, debug adapters, Codex and services are intentionally not added.
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'
set -g @continuum-boot 'off'

# TPM plugins. Continuum MUST remain last: it injects its save hook into
# status-right after theme plugins have set that option.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'janoamaral/tokyo-night-tmux'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'smart-splits-nvim/backend-tmux'
set -g @plugin 'tmux-plugins/tmux-continuum'

run '~/.tmux/plugins/tpm/tpm'

# Stable ASCII-safe status bar (must follow TPM to override theme formatting).
set -g status on
set -gu status-format
set -g status-left '[#S] '
set -g status-left-length 12
set -g status-right-length 150
setw -g window-status-format ' #I:#W '
setw -g window-status-current-format ' #I:#W* '
setw -g window-status-separator ''
set -g status-right '#($HOME/.config/tmux/plugins/tmux-continuum/scripts/continuum_save.sh)#($HOME/.local/bin/tmux-git-ascii #{q:pane_current_path})'
